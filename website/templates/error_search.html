{% extends '_base.html' %}

{% block title %}YT Downloader{% endblock %}


{% block head %}
<div class="flex items-center justify-center gap-3 mb-4 text-white">
    <p class="text-center text-4xl font-bold">An error occured</p>
    <i class="mt-1" data-lucide="unlink"></i>
</div>

<p class="text-white text-center text-[16px] font-[400]">Couldn't show results for "{{ query }}".  <a class="text-[#fa0000]" href="{{ url_for('views.home') }}">Go Home.</a></p>
{% endblock %}

{% block body %}
<p>{{error}}</p>
{% endblock %}
