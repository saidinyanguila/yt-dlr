<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player - Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[rgb(30,30,30)] text-white">
    <div id="root">
        <div class="relative mx-auto max-w-[1440px] flex justify-center items-start min-h-screen">
            <div class="inline-block mt-3 mx-auto border-white/35 px-10 py-4">
                <form method="POST">
                    <div class="text-center mb-8">
                        <p class="text-[28px] font-[600] mb-2">Welcome</p>
                        <p class="text-[14px] text-gray-300 font-[400] mx-auto max-w-[360px]">Create an account and start enjoying music in more ways you knew you could.</p>
                    </div>
                    <div class="w-full mb-4">
                        <p class="text-[16px] mb-2 font-[600]">First Name</p>
                        <input type="text" name="f_name" id="f_name" class="w-full px-3 py-2 border-1 border-white/40 hover:border-white/65 focus:outline-[1px] focus:outline-white/70 rounded-md">
                    </div>
                    <div class="w-full mb-4">
                        <p class="text-[16px] mb-2 font-[600]">Last Name (optional)</p>
                        <input type="text" name="l_name" id="l_name" class="w-full px-3 py-2 border-1 border-white/40 hover:border-white/65 focus:outline-[1px] focus:outline-white/70 rounded-md">
                    </div>
                    <div class="w-full mb-4">
                        <p class="text-[16px] mb-2 font-[600]">Email</p>
                        <input type="email" name="email" id="email" class="w-full px-3 py-2 border-1 border-white/40 hover:border-white/65 focus:outline-[1px] focus:outline-white/70 rounded-md">
                    </div>
                    <div class="w-full mb-5">
                        <p class="text-[16px] mb-2 font-[600]">Create a password</p>
                        <input type="password" name="password" id="password" class="w-full px-3 py-2 border-1 border-white/40 hover:border-white/65 focus:outline-[1px] focus:outline-white/70 rounded-md">
                    </div>
                    <button class="bg-red-500 w-full text-[16px] px-4 py-[10px] font-bold rounded-full cursor-pointer mb-4">Continue</button>
                </form>
                
                <div class="hidden">
                    <p class="text-[15px] text-center font-[600] my-5">or</p>

                    <div class="mb-5">
                        <button class="border-[1px] border-white/45 w-full text-[16px] px-4 py-[10px] font-bold rounded-full cursor-pointer mb-2">Sign in with Google</button>
                        <button class="border-[1px] border-white/45 w-full text-[16px] px-4 py-[10px] font-bold rounded-full cursor-pointer">Sign in with Apple</button>
                    </div>
                </div>

                <p class="text-[15px] text-center font-[600] my-5">Already have an account?</p>
                <a href="{{ url_for('auth.sign_in') }}" class="block mx-auto text-center border-[1px] border-white/45 text-[16px] px-4 py-[10px] font-bold rounded-full cursor-pointer">Sign In</a>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons()</script>
</body>
</html>
