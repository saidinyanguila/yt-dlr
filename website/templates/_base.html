<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <div class="min-h-screen bg-[#eaeaea]">
        <div class="bg-[#191919] px-3 py-8">
            <div class="max-w-[550px] mx-auto flex items-center justify-between">
                <a href="/" class="text-white text-center md:text-3xl text-xl font-bold">YT Downloader</a>

                <nav class="flex items-center justify-center gap-[2rem] px-[10px]">
                    {% block nav %}
                    <a class="text-[#fafafa] hover:text-[#fa0000]" href="{{ url_for('views.home') }}">Home</a>
                    <a class="text-[#fafafa] hover:text-[#fa0000]" href="{{ url_for('views.faq') }}">FAQ</a>
                    <a class="text-[#fafafa] hover:text-[#fa0000]" href="{{ url_for('views.donate') }}">Donate</a>
                    {% endblock %}
                </nav>
            </div>

            <div class="block max-w-[550px] mx-auto my-4">
                {% block head %}
                <form class="relative mt-12" action="search">
                    <input required id="q" name="q" placeholder="Search music" type="text" class="flex bg-[#fafafa] h-12 w-full rounded-sm border-0 outline-0 bg-background pl-3 pr-15 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground md:text-sm"/>
                    
                    <button type="submit" class="bg-[#fa0000] text-[#fafafa] rounded-tr-sm rounded-br-sm absolute right-0 top-0 h-full aspect-square px-2 flex items-center justify-center cursor-pointer" id="search_btn">
                        <i data-lucide="search"></i>
                    </button>
                </form>
                {% endblock %}
            </div>
        </div>  
        
        <div class="relative max-w-[550px] min-h-[80vh] mx-auto px-2 py-5">
            {% block body %}
            {% endblock %}
        </div>

        <footer class="md:py-5 py-10 border-t border-black/20">
            <div class="max-w-[550px] mx-auto">
                <div class="flex items-center justify-center gap-4 mb-3">
                    <a href="{{ url_for('views.contact') }}" class="text-black/85 text-[15px]">Contact</a>
                    <a href="{{ url_for('views.copyright_page') }}" class="text-black/85 text-[15px]">Copyright</a>
                    <a href="{{ url_for('views.privacy_policy') }}" class="text-black/85 text-[15px]">Privacy Policy</a>
                    <a href="{{ url_for('views.terms_of_use') }}" class="text-black/85 text-[15px]">Terms of Use</a>
                </div>
                
                <p class="text-center text-black/85 text-[16px]" id="cr_text">YT Downloader &copy</p>
            </div>
        </footer>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons()</script>
    <script src="/static/js/index.js"></script>
    {% block script %}{% endblock %}
</body>
</html>
