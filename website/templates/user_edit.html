<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Your Profile</title>
    <meta name="theme-color" content="#282828" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[rgb(30,30,30)] text-white">
    <div id="root">
        <div class="relative mx-auto max-w-[1440px] min-h-screen">
            <form method="POST" enctype="multipart/form-data" class="md:max-w-[500px] px-2 py-3 md:px-3 md:py-4">
                <p class="text-3xl font-[600] mb-6 md:mb-4">Edit Profile</p>

                <div class="pfp-section mb-8">
                    <p class="text-[16px] mb-2 font-[600]">Profile Photo</p>
                    
                    <div class="relative block md:mx-0 mx-auto w-[170px] h-[170px] rounded-full overflow-hidden">
                        <img id="pfp_upload-preview" class="absolute left-0 top-0 min-w-full h-full" src="/{{ user.user_img_path }}" alt="">

                        <label for="pfp_upload" class="absolute z-9 left-0 top-0 inset-0 flex flex-col bg-black/10 items-center justify-center gap-3 cursor-pointer">
                            <i data-lucide="pencil"></i>
                        </label>
                        <input type="file" name="image" id="pfp_upload" accept="image/*" style="display: none;">
                    </div>
                </div>

                <div class="info-section flex flex-col gap-5 mb-10">
                    <div class="w-full">
                        <p class="text-[16px] mb-2 font-[600]">First Name</p>
                        <input required type="text" class="w-full px-3 py-2 border-1 border-white/40 hover:border-white/65 focus:outline-[1px] focus:outline-white/70 rounded-md" name="f_name" id="f_name" value="{{ user.f_name }}">
                    </div>

                    <div class="w-full">
                        <p class="text-[16px] mb-2 font-[600]">Last Name</p>
                        <input type="text" class="w-full px-3 py-2 border-1 border-white/40 hover:border-white/65 focus:outline-[1px] focus:outline-white/70 rounded-md" name="l_name" id="l_name" value="{{ user.l_name }}">
                    </div>
                </div>

                <button type="submit" class="bg-red-500 w-full text-[16px] px-4 py-[10px] font-bold rounded-full cursor-pointer mb-4">Save Changes</button>
                <a href="{{ url_for('auth.account') }}" class="block mx-auto text-center border-[1px] border-white/45 text-[16px] px-4 py-[10px] font-bold rounded-full cursor-pointer">Cancel</a>
            </form>
        </div>

        <script>
            const imgInput = document.getElementById("pfp_upload");
            imgInput.addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (!file) return;

                const previewImg = document.getElementById('pfp_upload-preview');
                previewImg.src = URL.createObjectURL(file);
            });
        </script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>lucide.createIcons()</script>
    </div>
</body>
</html>
